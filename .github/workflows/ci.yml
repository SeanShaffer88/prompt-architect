name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Zero third-party dependencies: nothing to install, nothing to pin.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Lint the specification set
        run: python -m prompt_architect lint .

      - name: Golden prompts are reproducible
        run: |
          for spec_file in specs/*.json; do
            for variant in v0 v1 v2 v3; do
              python -m prompt_architect compose "$spec_file" \
                --variant "$variant" --check
            done
          done

      - name: Recorder can render a prompt without a key
        run: |
          python -m prompt_architect record \
            --spec specs/classification-routing.json \
            --suite benchmarks/suites/classification-routing.json \
            --model ci-smoke --dry-run > /dev/null

      - name: Every hardened run meets the ship bar
        run: |
          for suite in benchmarks/suites/*.json; do
            name=$(basename "$suite" .json)
            echo "::group::$name v3"
            python -m prompt_architect eval "$suite" \
              --run "benchmarks/runs/2026-11-08.$name.v3.json" --expect-pass
            echo "::endgroup::"
          done

      # The suite must still be able to fail: a harness that passes everything
      # measures nothing. V0 is the zero-shot baseline and must miss the bar.
      - name: Every zero-shot baseline still fails
        run: |
          for suite in benchmarks/suites/*.json; do
            name=$(basename "$suite" .json)
            echo "::group::$name v0"
            python -m prompt_architect eval "$suite" \
              --run "benchmarks/runs/2026-11-08.$name.v0.json" --expect-fail > /dev/null
            echo "::endgroup::"
          done
